name: Validate portfolio site
on:
  pull_request:
    branches: [main]
    paths:
      - index.html
      - ofc.html
      - pro.html
      - ai.html
      - cloud.html
      - api.html
      - project.css
      - data.json
      - robots.txt
      - sitemap.xml
      - favicon.svg
      - .github/workflows/validate-site.yml
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate JSON, metadata, project pages and inline JavaScript
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const data = JSON.parse(fs.readFileSync('data.json', 'utf8'));
          const html = fs.readFileSync('index.html', 'utf8');
          const robots = fs.readFileSync('robots.txt', 'utf8');
          const sitemap = fs.readFileSync('sitemap.xml', 'utf8');
          const favicon = fs.readFileSync('favicon.svg', 'utf8');
          for (const project of data.projects) {
            if (!html.includes(project.name)) throw new Error('Project not present in static HTML: ' + project.name);
          }
          for (const required of ['rel="canonical"', 'name="description"', 'property="og:title"', 'name="twitter:card"']) {
            if (!html.includes(required)) throw new Error('Missing SEO metadata: ' + required);
          }
          if (!robots.includes('Sitemap:')) throw new Error('robots.txt is missing a sitemap declaration');
          for (const page of ['ofc.html', 'pro.html', 'ai.html', 'cloud.html', 'api.html']) {
            const pageHtml = fs.readFileSync(page, 'utf8');
            const canonical = 'https://ephraimofc.github.io/EPHENYX/' + page;
            if (!pageHtml.includes('rel="canonical"') || !pageHtml.includes(canonical)) throw new Error('Project page canonical missing: ' + page);
            if (!pageHtml.includes('name="description"') || !pageHtml.includes('application/ld+json')) throw new Error('Project page metadata missing: ' + page);
            if (!sitemap.includes(canonical)) throw new Error('Project page missing from sitemap: ' + page);
          }
          if (!sitemap.includes('https://ephraimofc.github.io/EPHENYX/')) throw new Error('Homepage canonical URL is missing');
          const sitemapUrls = [...sitemap.matchAll(/<loc>([^<]+)<\\/loc>/g)].map(match => match[1]);
          const expectedUrls = [
            'https://ephraimofc.github.io/EPHENYX/',
            'https://ephraimofc.github.io/EPHENYX/ofc.html',
            'https://ephraimofc.github.io/EPHENYX/pro.html',
            'https://ephraimofc.github.io/EPHENYX/ai.html',
            'https://ephraimofc.github.io/EPHENYX/cloud.html',
            'https://ephraimofc.github.io/EPHENYX/api.html'
          ];
          if (sitemapUrls.length !== expectedUrls.length || new Set(sitemapUrls).size !== sitemapUrls.length || expectedUrls.some(url => !sitemapUrls.includes(url))) throw new Error('Sitemap URLs are incomplete or duplicated');
          const lastmods = [...sitemap.matchAll(/<lastmod>([^<]+)<\\/lastmod>/g)].map(match => match[1]);
          if (lastmods.length !== sitemapUrls.length || lastmods.some(date => !/^\\d{4}-\\d{2}-\\d{2}$/.test(date) || !Number.isFinite(Date.parse(date)) || new Date(date).toISOString().slice(0, 10) !== date)) throw new Error('Sitemap lastmod dates are missing or invalid');
          if (!favicon.includes('<svg')) throw new Error('favicon.svg is not SVG markup');
          const jsonEnd = html.indexOf('</script>');
          const scriptStart = html.indexOf('<script>', jsonEnd + 9);
          const scriptEnd = html.indexOf('</script>', scriptStart);
          if (scriptStart < 0 || scriptEnd < 0) throw new Error('Inline site script was not found');
          fs.writeFileSync('/tmp/portfolio-inline.js', html.slice(scriptStart + 8, scriptEnd));
          NODE
          node --check /tmp/portfolio-inline.js
